name: Django Security CI


on: [push]


jobs:
  build:
    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v3


    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'


    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Instal·lació neta de Firefox i Geckodriver al runner
        sudo apt-get update
        sudo apt-get install -y firefox firefox-geckodriver


    - name: Run Tests
      env:
        # Aquí cridem al secret que has de crear a GitHub
        SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      run: |
        # Usem MOZ_HEADLESS perquè GitHub no té pantalla
        MOZ_HEADLESS=1 python manage.py test core.tests_selenium
